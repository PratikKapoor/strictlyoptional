# Only non-default overrides. Theme defaults: https://blowfish.page/docs/configuration/
colorScheme = "blowfish"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
highlightCurrentMenuArea = true

[header]
  layout = "fixed-fill-blur"

[footer]
  showThemeAttribution = false

[homepage]
  layout = "industrial"
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = true
  cardViewScreenWidth = false

[article]
  showDateUpdated = true
  showBreadcrumbs = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = false
  sharingLinks = ["twitter", "linkedin", "reddit"]

[list]
  showBreadcrumbs = true
  showSummary = true
  showCards = true
