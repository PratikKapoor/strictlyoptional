# -- Site Configuration --
theme = "blowfish"
baseURL = "https://strictlyoptional.com/"
title = "strictlyoptional"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 30
enableEmoji = true

[pagination]
  pagerSize = 10

# Intentionally only tags + categories; theme also defines authors + series which we don't use.
[taxonomies]
  tag = "tags"
  category = "categories"

# Required for raw HTML in markdown (project cards wrapper div).
[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
