name: Deploy Hugo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      - uses: actions/cache@v4
        with:
          path: resources/
          key: hugo-resources-${{ hashFiles('assets/**') }}
          restore-keys: hugo-resources-

      - name: Build
        run: hugo --minify --printPathWarnings --printUnusedTemplates

      - name: Install htmltest
        run: curl https://htmltest.wjdp.uk | bash -s -- -b /usr/local/bin

      - name: Validate HTML & links
        run: htmltest -c .htmltest.yml

      - name: Lighthouse CI
        if: success()
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
